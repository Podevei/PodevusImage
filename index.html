<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podevus</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 大正浪漫 - 亮色模式 */
            --bg-primary: #FDF8F3;
            --bg-secondary: #F5EDE4;
            --bg-gradient-1: #FFF9F2;
            --bg-gradient-2: #F8E8D6;
            --text-primary: #2C1810;
            --text-secondary: #5C4033;
            --text-muted: #8B7355;
            --accent-gold: #C9A962;
            --accent-copper: #B87333;
            --accent-burgundy: #722F37;
            --accent-cream: #FFF8DC;
            --border-ornate: #D4B896;
            --shadow-color: rgba(139, 115, 85, 0.2);
            --particle-color: rgba(201, 169, 98, 0.6);
            --gear-color: rgba(184, 115, 51, 0.12);
            --line-color: rgba(212, 184, 150, 0.4);
            --glow-color: rgba(201, 169, 98, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 大正浪漫 - 深色模式 */
                --bg-primary: #1A1512;
                --bg-secondary: #231D18;
                --bg-gradient-1: #1A1512;
                --bg-gradient-2: #2A211A;
                --text-primary: #F5E6D3;
                --text-secondary: #D4C4B0;
                --text-muted: #9A8B7A;
                --accent-gold: #D4AF37;
                --accent-copper: #CD7F32;
                --accent-burgundy: #8B3A3A;
                --accent-cream: #3D3428;
                --border-ornate: #5C4D3C;
                --shadow-color: rgba(0, 0, 0, 0.5);
                --particle-color: rgba(212, 175, 55, 0.7);
                --gear-color: rgba(205, 127, 50, 0.1);
                --line-color: rgba(92, 77, 60, 0.5);
                --glow-color: rgba(212, 175, 55, 0.25);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', 'Shippori Mincho', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            cursor: none;
            transition: background 0.6s ease, color 0.6s ease;
        }

        /* ===== 高级光标系统 ===== */
        .cursor-main {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 100000;
            transform: translate(-50%, -50%);
        }

        .cursor-hexagon {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.2s ease, opacity 0.3s ease;
        }

        .cursor-hexagon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--accent-gold);
            stroke-width: 1.5;
            transition: stroke 0.3s ease;
        }

        .cursor-hexagon .hex-inner {
            stroke: var(--accent-copper);
            stroke-width: 1;
            transform-origin: center;
            animation: hexRotate 8s linear infinite reverse;
        }

        .cursor-center {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            transform: translate(-50%, -50%) rotate(45deg);
            pointer-events: none;
            z-index: 100001;
            transition: transform 0.15s ease, background 0.3s ease;
        }

        .cursor-trail {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--accent-gold);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 99999;
        }

        .cursor-main.hover .cursor-hexagon {
            transform: scale(1.5) rotate(30deg);
        }

        .cursor-main.hover .cursor-hexagon svg {
            stroke: var(--accent-copper);
        }

        .cursor-center.hover {
            transform: translate(-50%, -50%) rotate(45deg) scale(1.5);
            background: var(--accent-copper);
        }

        @keyframes hexRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== 高级加载遮罩系统 ===== */
        .loader-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s ease;
        }

        /* 机械齿轮加载器 */
        .mechanical-loader {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .loader-gear-main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            animation: rotateGear 4s linear infinite;
        }

        .loader-gear-main path {
            fill: none;
            stroke: var(--accent-copper);
            stroke-width: 2;
        }

        .loader-gear-orbit {
            position: absolute;
            animation: rotateGear 6s linear infinite reverse;
        }

        .loader-gear-orbit path {
            fill: none;
            stroke: var(--accent-gold);
            stroke-width: 1.5;
        }

        .orbit-1 { top: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; }
        .orbit-2 { bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; }
        .orbit-3 { top: 50%; left: 0; transform: translateY(-50%); width: 40px; height: 40px; }
        .orbit-4 { top: 50%; right: 0; transform: translateY(-50%); width: 40px; height: 40px; }

        .loader-particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .loader-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-gold);
            border-radius: 50%;
            animation: particleFloat 3s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
            50% { opacity: 1; }
        }

        .loader-text {
            margin-top: 50px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            color: var(--text-muted);
            text-transform: uppercase;
            position: relative;
        }

        .loader-text::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: var(--accent-gold);
            animation: lineExpand 2s ease-in-out infinite;
        }

        @keyframes lineExpand {
            0%, 100% { width: 0; }
            50% { width: 120px; }
        }

        .loader-percentage {
            margin-top: 35px;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--accent-copper);
            letter-spacing: 0.2em;
        }

        @keyframes rotateGear {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ===== 超级高级退出过渡系统 ===== */
        .exit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
        }

        .hex-grid-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; }
        .hex-cell { position: absolute; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: var(--accent-copper); transform-origin: center; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .gear-burst-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .burst-gear { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0) rotate(0deg); transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .burst-gear svg { fill: none; stroke: var(--accent-gold); stroke-width: 1.5; }
        .particle-explosion-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .explosion-particle { position: absolute; width: 3px; height: 3px; background: var(--accent-gold); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .ripple-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .ripple-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--accent-copper); border-radius: 50%; width: 0; height: 0; opacity: 0; transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .scanline-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; overflow: hidden; }
        .scanline { position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--accent-gold) 50%, transparent 100%); top: -2px; box-shadow: 0 0 20px var(--accent-gold); }
        .fractal-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .fractal-line { position: absolute; background: var(--accent-copper); transform-origin: left center; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .light-beam-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .light-beam { position: absolute; top: 50%; left: 50%; width: 2px; height: 0; background: linear-gradient(to bottom, transparent 0%, var(--accent-gold) 50%, transparent 100%); transform-origin: center; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 20px var(--accent-gold); }

        .exit-overlay.active .hex-grid-layer { opacity: 1; }
        .exit-overlay.active .hex-cell { transform: scale(1.2); opacity: 0; }
        .exit-overlay.active .gear-burst-layer { opacity: 1; }
        .exit-overlay.active .burst-gear { transform: translate(-50%, -50%) scale(3) rotate(360deg); opacity: 0; }
        .exit-overlay.active .particle-explosion-layer { opacity: 1; }
        .exit-overlay.active .ripple-layer { opacity: 1; }
        .exit-overlay.active .ripple-circle { width: 2000px; height: 2000px; opacity: 0; }
        .exit-overlay.active .scanline-layer { opacity: 1; }
        .exit-overlay.active .fractal-layer { opacity: 1; }
        .exit-overlay.active .light-beam-layer { opacity: 1; }
        .exit-overlay.active .light-beam { height: 2000px; }

        /* ===== 主容器 ===== */
        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .main-container.loaded {
            opacity: 1;
        }

        /* ===== 背景层 ===== */
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .bg-gradient { background: radial-gradient(ellipse at 30% 20%, var(--bg-gradient-2) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, var(--bg-gradient-2) 0%, transparent 50%), var(--bg-gradient-1); transition: background 0.6s ease; }
        .bg-grid { background-image: linear-gradient(var(--line-color) 1px, transparent 1px), linear-gradient(90deg, var(--line-color) 1px, transparent 1px); background-size: 80px 80px; opacity: 0.3; }
        .bg-noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.03; }

        /* ===== 齿轮容器 ===== */
        .gear-system { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
        .gear { position: absolute; opacity: 0; transition: opacity 0.8s ease; }
        .gear svg { width: 100%; height: 100%; transition: fill 0.6s ease; overflow: visible; }
        .gear svg path { fill: var(--gear-color); }
        .gear-1 { top: -12%; left: -12%; width: 320px; height: 320px; animation: gearSpin 60s linear infinite; }
        .gear-2 { top: -12%; right: -12%; width: 320px; height: 320px; animation: gearSpin 60s linear infinite reverse; }
        .gear-3 { bottom: -12%; left: -12%; width: 320px; height: 320px; animation: gearSpin 60s linear infinite reverse; }
        .gear-4 { bottom: -12%; right: -12%; width: 320px; height: 320px; animation: gearSpin 60s linear infinite; }
        .gear-5 { top: -6%; left: 50%; transform: translateX(-50%); width: 140px; height: 140px; animation: gearSpinX 40s linear infinite; }
        .gear-6 { bottom: -6%; left: 50%; transform: translateX(-50%); width: 140px; height: 140px; animation: gearSpinX 40s linear infinite reverse; }
        .gear-7 { top: 50%; left: -4%; transform: translateY(-50%); width: 120px; height: 120px; animation: gearSpinY 35s linear infinite reverse; }
        .gear-8 { top: 50%; right: -4%; transform: translateY(-50%); width: 120px; height: 120px; animation: gearSpinY 35s linear infinite; }
        .gear-9 { top: 18%; left: 15%; width: 70px; height: 70px; animation: gearSpin 25s linear infinite; }
        .gear-10 { top: 18%; right: 15%; width: 70px; height: 70px; animation: gearSpin 25s linear infinite reverse; }
        .gear-11 { bottom: 18%; left: 15%; width: 70px; height: 70px; animation: gearSpin 25s linear infinite reverse; }
        .gear-12 { bottom: 18%; right: 15%; width: 70px; height: 70px; animation: gearSpin 25s linear infinite; }

        @keyframes gearSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes gearSpinX { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }
        @keyframes gearSpinY { from { transform: translateY(-50%) rotate(0deg); } to { transform: translateY(-50%) rotate(360deg); } }

        /* ===== 粒子画布 ===== */
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* ===== 装饰线条 ===== */
        .decorative-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
        .deco-line { position: absolute; background: linear-gradient(90deg, transparent, var(--border-ornate), transparent); opacity: 0; transition: opacity 0.6s ease; }
        .deco-line-h1 { top: 12%; left: 0; width: 25%; height: 1px; }
        .deco-line-h2 { top: 12%; right: 0; width: 25%; height: 1px; }
        .deco-line-h3 { bottom: 12%; left: 0; width: 25%; height: 1px; }
        .deco-line-h4 { bottom: 12%; right: 0; width: 25%; height: 1px; }
        .deco-line-v1 { top: 0; left: 12%; width: 1px; height: 20%; background: linear-gradient(to bottom, transparent, var(--border-ornate), transparent); }
        .deco-line-v2 { top: 0; right: 12%; width: 1px; height: 20%; background: linear-gradient(to bottom, transparent, var(--border-ornate), transparent); }
        .deco-line-v3 { bottom: 0; left: 12%; width: 1px; height: 20%; background: linear-gradient(to top, transparent, var(--border-ornate), transparent); }
        .deco-line-v4 { bottom: 0; right: 12%; width: 1px; height: 20%; background: linear-gradient(to top, transparent, var(--border-ornate), transparent); }

        /* ===== 角落装饰 ===== */
        .corner-ornament { position: absolute; width: 120px; height: 120px; opacity: 0; transition: opacity 0.8s ease; }
        .corner-ornament svg { width: 100%; height: 100%; fill: none; stroke: var(--border-ornate); stroke-width: 1; transition: stroke 0.6s ease; }
        .corner-tl { top: 25px; left: 25px; }
        .corner-tr { top: 25px; right: 25px; transform: scaleX(-1); }
        .corner-bl { bottom: 25px; left: 25px; transform: scaleY(-1); }
        .corner-br { bottom: 25px; right: 25px; transform: scale(-1); }

        /* ===== 内容区域 ===== */
        .content-wrapper { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .logo-section { position: relative; margin-bottom: 30px; opacity: 0; transform: translateY(30px); }
        .logo-frame { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
        .logo-border { position: absolute; width: 100%; height: 100%; border: 1px solid var(--border-ornate); transform: rotate(45deg); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .logo-border-inner { position: absolute; width: 82%; height: 82%; border: 1px solid var(--accent-gold); transform: rotate(45deg); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .logo-placeholder { width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 600; color: var(--accent-copper); text-shadow: 0 0 30px var(--glow-color); transition: all 0.4s ease; }
        .logo-frame:hover .logo-border { transform: rotate(405deg); border-color: var(--accent-gold); }
        .logo-frame:hover .logo-border-inner { transform: rotate(405deg); border-color: var(--accent-copper); }
        .logo-frame:hover .logo-placeholder { color: var(--accent-gold); text-shadow: 0 0 50px var(--glow-color); }

        .title-section { text-align: center; margin-bottom: 25px; opacity: 0; transform: translateY(30px); }
        .title-ornament { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 20px; }
        .ornament-line { width: 70px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent-gold), transparent); }
        .ornament-diamond { width: 10px; height: 10px; border: 1px solid var(--accent-gold); transform: rotate(45deg); position: relative; }
        .ornament-diamond::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: var(--accent-copper); transform: translate(-50%, -50%); }
        .main-title { font-family: 'Cinzel', serif; font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 400; letter-spacing: 0.25em; color: var(--text-primary); text-transform: uppercase; transition: color 0.6s ease; }
        .main-title .letter { display: inline-block; opacity: 0; transform: translateY(40px); transition: color 0.6s ease; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 25px 0; opacity: 0; }
        .divider-line { width: 100px; height: 1px; background: var(--border-ornate); transition: background 0.6s ease; }
        .divider-center { width: 6px; height: 6px; border: 1px solid var(--accent-gold); transform: rotate(45deg); }

        .description { text-align: center; max-width: 550px; margin-bottom: 35px; opacity: 0; transform: translateY(20px); }
        .description p { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; font-size: 1.1rem; line-height: 2; color: var(--text-secondary); font-weight: 400; letter-spacing: 0.05em; transition: color 0.6s ease; }

        .enter-section { opacity: 0; transform: translateY(30px); }
        .enter-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 15px; padding: 18px 45px; background: transparent; border: 1px solid var(--accent-gold); color: var(--text-primary); font-family: 'Cinzel', serif; font-size: 0.9rem; letter-spacing: 0.3em; text-transform: uppercase; text-decoration: none; cursor: none; overflow: hidden; transition: all 0.5s ease; }
        .enter-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, var(--accent-gold), transparent); transition: left 0.6s ease; opacity: 0.3; }
        .enter-btn:hover::before { left: 100%; }
        .enter-btn::after { content: ''; position: absolute; inset: 0; background: var(--accent-cream); transform: scaleX(0); transform-origin: left; transition: transform 0.5s ease; z-index: -1; }
        .enter-btn:hover::after { transform: scaleX(1); }
        .enter-btn:hover { border-color: var(--accent-copper); color: var(--accent-burgundy); }
        .btn-text { position: relative; z-index: 1; }
        .btn-arrow { position: relative; z-index: 1; width: 20px; height: 1px; background: var(--accent-gold); transition: all 0.4s ease; }
        .btn-arrow::after { content: ''; position: absolute; right: 0; top: 50%; width: 7px; height: 7px; border-right: 1px solid var(--accent-gold); border-top: 1px solid var(--accent-gold); transform: translateY(-50%) rotate(45deg); transition: border-color 0.4s ease; }
        .enter-btn:hover .btn-arrow { width: 28px; background: var(--accent-copper); }
        .enter-btn:hover .btn-arrow::after { border-color: var(--accent-copper); }

        .footer-info { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 25px; opacity: 0; transition: opacity 0.6s ease; }
        .footer-item { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; transition: color 0.6s ease; }
        .footer-divider { width: 4px; height: 4px; background: var(--accent-gold); transform: rotate(45deg); }

        .ambient-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%); pointer-events: none; opacity: 0.4; filter: blur(60px); z-index: 1; transition: background 0.6s ease; }

        /* ===== Taisho Roman + Steampunk 书架图册系统 ===== */
        .m3-gallery-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(var(--bg-primary-rgb), 0.7); /* 整体背景半透明 SCRIM */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            
            /* 由上往下划出 */
            transform: translateY(-100%);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
            
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .m3-gallery-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* 透明背景 金丝线框书架 */
        .steampunk-shelf {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8rem; /* 分开两个相册 */
            padding: 2rem;
            width: 90%;
            max-width: 1200px;
            position: relative;
            background: transparent; /* 背景完全透明 */
        }

        /* 书架的金丝框架装饰 ::after */
        .steampunk-shelf::after {
            content: '';
            position: absolute;
            inset: -15px;
            border: 1px solid var(--accent-gold); /* 金丝外框 */
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
        }

        /* 书架的实体黄铜支架/齿轮装饰 ::before */
        .steampunk-shelf::before {
            content: '';
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            /* complex filigree mask or ornate background pattern */
            background-image: 
                radial-gradient(circle at 10% 0, transparent 20px, var(--accent-copper) 22px, var(--accent-gold) 26px, transparent 28px),
                radial-gradient(circle at 90% 0, transparent 20px, var(--accent-copper) 22px, var(--accent-gold) 26px, transparent 28px);
            opacity: 0.9;
            z-index: 0;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.8));
        }

        /* ===== 相册块重新设计 (符合审美) ===== */
        .m3-image-card {
            position: relative;
            width: 100%;
            max-width: 380px; /* 两张图可以稍微放大 */
            border-radius: 0; /* 删除了 Material 圆角 */
            background: transparent;
            perspective: 1000px;
            z-index: 2; /* 在书架框架上方 */
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.7)); /* 模拟书架上的阴影 */
        }

        /* 内部核心框:  Taisho Roman 审美 - 切角和复杂边框 */
        .m3-card-inner {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            /* Ornate brass/gold frame - thick borders with filigree corners */
            border: 4px solid var(--accent-copper);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.8),
                inset 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.6s cubic-bezier(0.2, 0, 0, 1);
            transform-origin: center bottom;
        }

        /* 内部金丝细线装饰线 ::after */
        .m3-card-inner::after {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid var(--accent-gold);
            opacity: 0.5;
            pointer-events: none;
        }

        /* Taisho Roman Cut corners - clip-path for complex shape */
        .m3-card-inner {
            clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 15px 100%, 0 calc(100% - 15px), 0 15px);
        }

        /* 悬停效果: Taisho Roman Cut Corners shape changes slightly */
        .m3-image-card:hover .m3-card-inner {
            transform: translateY(-20px);
            box-shadow: 0 30px 60px rgba(0,0,0,1);
            border-color: var(--accent-gold);
        }

        /* 图片 Wrapper: 复古拱门形状 */
        .m3-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            /* 拱门形状 */
            border-radius: 50% 50% 0 0;
            transform: scale(0.9); /* 让图片框小一点 */
            transition: all 0.6s ease;
        }

        .m3-image-card:hover .m3-image-wrapper {
            transform: scale(1);
        }

        /* 图片: Taisho Roman Deep Sepia Retro filter */
        .m3-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1), filter 0.8s ease;
            filter: sepia(0.8) contrast(1.1) brightness(0.9); /* Deep retro sepia */
        }

        .m3-image-card:hover .m3-img {
            transform: scale(1.05);
            filter: sepia(0) contrast(1.3) brightness(1.1); /* 悬停恢复正常并高亮 */
        }
        
        /* 图片遮罩 SCRIM - 变成暗金色 */
        .m3-surface-overlay {
            position: absolute;
            inset: 0;
            background: var(--glow-color);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.2, 0, 0, 1);
            z-index: 3;
            mix-blend-mode: color-burn; /* 颜色灼烧 */
        }

        .m3-image-card:hover .m3-surface-overlay {
            opacity: 1;
            background: rgba(201, 169, 98, 0.4);
        }
        
        /* ===== 机械光圈发条 Iris Shape FAB ===== */
        .m3-fab {
            width: 70px;
            height: 70px;
            background: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            /* iris shape initial scale */
            transform: translateY(30px) scale(0.6);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            border-radius: 5px; /* Square shape with cut corners? complex. Just square for now. */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-decoration: none; /* remove underline for blog link */
        }

        .m3-image-card:hover .m3-fab {
            transform: translateY(0) scale(1) rotate(0deg);
            opacity: 1;
        }

        /* Iris Clockwise Spinning and background color change on hover */
        .m3-fab:hover {
            background: var(--accent-copper);
            color: var(--bg-primary);
            transform: translateY(0) scale(1.1) rotate(360deg); /* 360 degree Iris spin */
            border-color: var(--accent-copper);
        }

        /* Iris Path Path design - mechanical gear iris in SVG path */
        .m3-fab svg {
            width: 70%;
            height: 70%;
            transition: all 0.4s ease;
        }

        .m3-fab:hover svg {
            transform: scale(0.9);
        }
        
        /* 标题内容区 */
        .m3-card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 2rem 2rem;
            z-index: 4;
            transform: translateY(10px);
            transition: transform 0.6s cubic-bezier(0.2, 0, 0, 1);
            pointer-events: none; /* 穿透链接点击图片上方区域时触发图片而非文本 */
        }

        /* Content Scrim暗金色渐变 */
        .m3-scrim {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(26, 21, 18, 0.95) 20%, transparent 100%);
            z-index: -1;
            opacity: 0.9;
            transition: opacity 0.6s ease;
        }

        .m3-image-card:hover .m3-card-content {
            transform: translateY(0);
        }

        .m3-image-card:hover .m3-scrim {
            opacity: 1;
            background: linear-gradient(to top, rgba(26, 21, 18, 1) 40%, transparent 100%);
        }

        /* 标题: Taisho Roman etched appearance */
        .m3-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--accent-gold); /* 暗金色 */
            margin-bottom: 0.5rem;
            text-shadow: 0 3px 6px rgba(0,0,0,0.9);
            font-weight: 500;
        }

        /* 描述: Taisho Roman aged paper look text color */
        .m3-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: var(--text-secondary); /* 茶褐色文字 */
            letter-spacing: 0.12em;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s cubic-bezier(0.2, 0, 0, 1);
        }

        .m3-image-card:hover .m3-subtitle {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 涟漪效果 - Taisho Roman Gold ripple color burn */
        .m3-ripple {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-gold);
            mix-blend-mode: color-burn; /* 颜色灼烧涟漪 */
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-effect { to { transform: scale(4); opacity: 0; } }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .corner-ornament { width: 70px; height: 70px; }
            .corner-tl, .corner-tr { top: 15px; }

            .cursor-main, .cursor-center, .cursor-trail { display: none; }

            /* 书架图册响应式 */
            .steampunk-shelf {
                flex-direction: column;

                gap: 4rem;
                padding-bottom: 0;
            }
            
            /* 移动端隐藏书架托架 ::before 以防止错位 */
            .steampunk-shelf::before {

            }
            /* 移动端保留书架金丝外框 ::after 作为线框感 */

                inset: -5px;
            }

            .m3-gallery-container {
                overflow-y: auto;
            }
        }
    </style>
</head>

    <script>
        // 定义全局颜色 RGB var 以便 color-burn
        const rootStyle = getComputedStyle(document.documentElement);
        document.documentElement.style.setProperty('--bg-primary-rgb', '253, 248, 243'); /* 大正浪漫-亮色-红褐色文字 */
        if (rootStyle.getPropertyValue('--bg-primary').trim() === '#1A1512') { /* 深色模式 */
            document.documentElement.style.setProperty('--bg-primary-rgb', '26, 21, 18'); /* 大正浪漫-深色 */
        }

        // ===== Material 3 涟漪效果引擎 ( Taisho Roman color burn ) =====
        function initM3Ripples() {
            const triggers = document.querySelectorAll('.ripple-trigger, .m3-image-card');
            triggers.forEach(trigger => {
                trigger.addEventListener('mousedown', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'm3-ripple';
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = `${size}px`;
                    ripple.style.left = `${x - size / 2}px`;
                    ripple.style.top = `${y - size / 2}px`;
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                });
            });
        }

        // ===== 渐开线齿轮生成器 =====
        class InvoluteGearGenerator {
            constructor() { this.pressureAngle = 20 * Math.PI / 180; }
            generatePath(numTeeth, outerRadius, holeRadius) {
                const module = outerRadius / (numTeeth + 2) * 2;
                const pitchRadius = (module * numTeeth) / 2;
                const baseRadius = pitchRadius * Math.cos(this.pressureAngle);
                const dedendum = module * 1.25;
                const rootRadius = pitchRadius - dedendum;
                const stepCount = 15;
                const profilePoints = [];
                const maxT = Math.sqrt(Math.pow(outerRadius / baseRadius, 2) - 1);
                
                for (let i = 0; i <= stepCount; i++) {
                    const t = maxT * (i / stepCount);
                    const x = baseRadius * (Math.cos(t) + t * Math.sin(t));
                    const y = baseRadius * (Math.sin(t) - t * Math.cos(t));
                    profilePoints.push({x, y});
                }
                const invAlpha = Math.tan(this.pressureAngle) - this.pressureAngle;
                const targetAngle = (Math.PI / 2) / numTeeth;
                const angleOffset = targetAngle + invAlpha;
                return this.generateSimplePath(numTeeth, outerRadius, holeRadius, rootRadius, baseRadius, profilePoints, angleOffset);
            }
            generateSimplePath(numTeeth, outerRadius, holeRadius, rootRadius, baseRadius, profilePoints, angleOffset) {
                let d = "";
                const anglePerTooth = (2 * Math.PI) / numTeeth;
                for(let i=0; i<numTeeth; i++) {
                    const centerAngle = i * anglePerTooth;
                    for(let j=0; j<profilePoints.length; j++) {
                        const p = profilePoints[j];
                        const r = Math.sqrt(p.x*p.x + p.y*p.y);
                        const invAngle = Math.atan2(p.y, p.x); 
                        const theta = centerAngle - angleOffset + invAngle;
                        const px = r * Math.cos(theta);
                        const py = r * Math.sin(theta);
                        if (i===0 && j===0) d += `M ${px.toFixed(3)} ${py.toFixed(3)}`;
                        else d += ` L ${px.toFixed(3)} ${py.toFixed(3)}`;
                    }
                    const pTop = profilePoints[profilePoints.length-1];
                    const rTop = Math.sqrt(pTop.x*pTop.x + pTop.y*pTop.y);
                    const invAngleTop = Math.atan2(pTop.y, pTop.x);
                    const thetaTopLeft = centerAngle + angleOffset - invAngleTop;
                    const pxTop = rTop * Math.cos(thetaTopLeft);
                    const pyTop = rTop * Math.sin(thetaTopLeft);
                    d += ` A ${rTop.toFixed(3)} ${rTop.toFixed(3)} 0 0 1 ${pxTop.toFixed(3)} ${pyTop.toFixed(3)}`;
                    for(let j=profilePoints.length-1; j>=0; j--) {
                        const p = profilePoints[j];
                        const r = Math.sqrt(p.x*p.x + p.y*p.y);
                        const invAngle = Math.atan2(p.y, p.x);
                        const theta = centerAngle + angleOffset - invAngle;
                        const px = r * Math.cos(theta);
                        const py = r * Math.sin(theta);
                        d += ` L ${px.toFixed(3)} ${py.toFixed(3)}`;
                    }
                    const nextCenterAngle = (i + 1) * anglePerTooth;
                    const pBase = profilePoints[0];
                    const invAngleBase = Math.atan2(pBase.y, pBase.x);
                    const nextThetaStart = nextCenterAngle - angleOffset + invAngleBase;
                    const rootX = rootRadius * Math.cos((centerAngle + angleOffset + nextThetaStart)/2);
                    const rootY = rootRadius * Math.sin((centerAngle + angleOffset + nextThetaStart)/2);
                    const nextPx = baseRadius * Math.cos(nextThetaStart);
                    const nextPy = baseRadius * Math.sin(nextThetaStart);
                    d += ` L ${rootX.toFixed(3)} ${rootY.toFixed(3)}`;
                    d += ` L ${nextPx.toFixed(3)} ${nextPy.toFixed(3)}`;
                }
                d += " Z";
                d += ` M ${holeRadius} 0`;
                d += ` A ${holeRadius} ${holeRadius} 0 1 0 ${-holeRadius} 0`;
                d += ` A ${holeRadius} ${holeRadius} 0 1 0 ${holeRadius} 0 Z`;
                return d;
            }
            generateSVG(teeth, size = 100) {
                const outerRadius = (size / 2) * 0.95;
                const holeRadius = outerRadius * 0.25;
                const pathData = this.generatePath(teeth, outerRadius, holeRadius);
                return `<svg viewBox="-${size/2} -${size/2} ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><path d="${pathData}" fill-rule="evenodd"/></svg>`;
            }
        }

        // ===== 创建齿轮 =====
        function createGears() {
            const gearSystem = document.getElementById('gear-system');
            const generator = new InvoluteGearGenerator();
            const gearConfigs = [
                { class: 'gear-1', teeth: 32 }, { class: 'gear-2', teeth: 32 }, { class: 'gear-3', teeth: 32 }, { class: 'gear-4', teeth: 32 },
                { class: 'gear-5', teeth: 24 }, { class: 'gear-6', teeth: 24 }, { class: 'gear-7', teeth: 16 }, { class: 'gear-8', teeth: 16 },
                { class: 'gear-9', teeth: 12 }, { class: 'gear-10', teeth: 12 }, { class: 'gear-11', teeth: 12 }, { class: 'gear-12', teeth: 12 }
            ];
            gearConfigs.forEach(config => {
                const svg = generator.generateSVG(config.teeth, 100);
                const gearDiv = document.createElement('div');
                gearDiv.className = `gear ${config.class}`;
                gearDiv.innerHTML = svg;
                gearSystem.appendChild(gearDiv);
            });

            const mainGearPath = generator.generatePath(16, 45, 12);
            document.getElementById('loader-gear-main').innerHTML = `<path d="${mainGearPath}" fill-rule="evenodd"/>`;
            const orbitGearPath = generator.generatePath(8, 18, 5);
            ['orbit-1', 'orbit-2', 'orbit-3', 'orbit-4'].forEach(id => {
                document.getElementById(id).innerHTML = `<path d="${orbitGearPath}" fill-rule="evenodd"/>`;
            });

            const particlesContainer = document.getElementById('loader-particles');
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'loader-particle';
                const angle = (i / 12) * Math.PI * 2;
                const radius = 80;
                particle.style.left = `${50 + Math.cos(angle) * radius}%`;
                particle.style.top = `${50 + Math.sin(angle) * radius}%`;
                particle.style.animationDelay = `${i * 0.1}s`;
                particlesContainer.appendChild(particle);
            }
        }

        // ===== 全局变量与光标 =====
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetX = mouseX;
        let targetY = mouseY;
        let trailParticles = [];
        const maxTrails = 20;
        const cursorMain = document.querySelector('.cursor-main');
        const cursorCenter = document.querySelector('.cursor-center');
        const trailsContainer = document.getElementById('cursor-trails');
        const ambientGlow = document.querySelector('.ambient-glow');

        function updateCursor(e) {
            targetX = e.clientX;
            targetY = e.clientY;
            createTrailParticle(e.clientX, e.clientY);
        }

        function createTrailParticle(x, y) {
            if (trailParticles.length >= maxTrails) {
                const oldest = trailParticles.shift();
                oldest.element.remove();
            }
            const particle = document.createElement('div');
            particle.className = 'cursor-trail';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.opacity = '0.6';
            particle.style.transform = 'translate(-50%, -50%) scale(1)';
            trailsContainer.appendChild(particle);
            trailParticles.push({ element: particle, life: 1, decay: 0.03 });
        }

        function animateCursor() {
            mouseX += (targetX - mouseX) * 0.15;
            mouseY += (targetY - mouseY) * 0.15;
            if (cursorMain && cursorCenter) {
                cursorMain.style.left = mouseX + 'px';
                cursorMain.style.top = mouseY + 'px';
                cursorCenter.style.left = targetX + 'px';
                cursorCenter.style.top = targetY + 'px';
            }
            trailParticles.forEach((p, index) => {
                p.life -= p.decay;
                if (p.life <= 0) {
                    p.element.remove();
                    trailParticles.splice(index, 1);
                } else {
                    p.element.style.opacity = p.life * 0.5;
                    p.element.style.transform = `translate(-50%, -50%) scale(${p.life})`;
                }
            });
            requestAnimationFrame(animateCursor);
        }

        function updateGlow() {
            if (ambientGlow) {
                ambientGlow.style.left = (mouseX - 250) + 'px';
                ambientGlow.style.top = (mouseY - 250) + 'px';
            }
        }

        // ===== 粒子系统 =====
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();
            }
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            init() {
                const particleCount = Math.floor((this.canvas.width * this.canvas.height) / 15000);
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speedX: (Math.random() - 0.5) * 0.3,
                        speedY: (Math.random() - 0.5) * 0.3,
                        opacity: Math.random() * 0.5 + 0.2,
                        pulse: Math.random() * Math.PI * 2
                    });
                }
            }
            update() {
                this.particles.forEach(p => {
                    p.x += p.speedX; p.y += p.speedY; p.pulse += 0.02;
                    const dx = mouseX - p.x; const dy = mouseY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) { p.x += dx * 0.01; p.y += dy * 0.01; }
                    if (p.x < 0) p.x = this.canvas.width;
                    if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height;
                    if (p.y > this.canvas.height) p.y = 0;
                });
            }
            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const style = getComputedStyle(document.documentElement);
                const particleColor = style.getPropertyValue('--particle-color').trim();
                this.particles.forEach(p => {
                    const pulseOpacity = p.opacity * (0.7 + Math.sin(p.pulse) * 0.3);
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = particleColor.replace('0.6', pulseOpacity.toString());
                    this.ctx.fill();
                });
                this.particles.forEach((p1, i) => {
                    this.particles.slice(i + 1).forEach(p2 => {
                        const dx = p1.x - p2.x; const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            this.ctx.beginPath(); this.ctx.moveTo(p1.x, p1.y); this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = particleColor.replace('0.6', (0.15 * (1 - dist / 100)).toString());
                            this.ctx.stroke();
                        }
                    });
                });
            }
            animate() {
                this.update(); this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        // ===== 加载与入场动画 =====
        function simulateLoading() {
            const loaderMask = document.querySelector('.loader-mask');
            const mainContainer = document.querySelector('.main-container');
            const percentageEl = document.getElementById('loader-percentage');
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 8 + 3;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        loaderMask.style.opacity = '0';
                        loaderMask.style.pointerEvents = 'none';
                        setTimeout(() => {
                            loaderMask.style.display = 'none';
                            mainContainer.classList.add('loaded');
                            startEntranceAnimations();
                        }, 500);
                    }, 300);
                }
                percentageEl.textContent = Math.floor(progress) + '%';
            }, 120);
        }

        function startEntranceAnimations() {
            const timeline = [
                { el: '.gear', delay: 0, style: 'opacity', value: '1' },
                { el: '.deco-line', delay: 200, style: 'opacity', value: '1' },
                { el: '.corner-ornament', delay: 400, style: 'opacity', value: '1' },
                { el: '.logo-section', delay: 500, transform: true },
                { el: '.title-section', delay: 700, transform: true },
                { el: '.divider', delay: 900, style: 'opacity', value: '1' },
                { el: '.description', delay: 1000, transform: true },
                { el: '.enter-section', delay: 1100, transform: true },
                { el: '.footer-info', delay: 1300, style: 'opacity', value: '1' }
            ];
            timeline.forEach(item => {
                setTimeout(() => {
                    const elements = document.querySelectorAll(item.el);
                    elements.forEach(el => {
                        if (item.transform) { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }
                        else { el.style[item.style] = item.value; }
                    });
                }, item.delay);
            });
            setTimeout(() => {
                document.querySelectorAll('.letter').forEach((letter, index) => {
                    setTimeout(() => { letter.style.opacity = '1'; letter.style.transform = 'translateY(0)'; }, index * 70);
                });
            }, 800);
        }

        // ===== 画廊展开动画系统 (替代原跳转逻辑) =====
        function createExitTransition() {
            const generator = new InvoluteGearGenerator();
            
            // 已删除 hex-grid-layer 逻辑，修复卡加载的问题
            
            const gearBurstLayer = document.getElementById('gear-burst-layer');
            const gearCounts = [6, 8, 10, 12];
            gearCounts.forEach((count, layer) => {
                for (let i = 0; i < count; i++) {
                    const gear = document.createElement('div');
                    gear.className = 'burst-gear';
                    const angle = (i / count) * Math.PI * 2;
                    const distance = 100 + layer * 80;
                    gear.style.left = '50%'; gear.style.top = '50%';
                    gear.style.width = (60 - layer * 10) + 'px'; gear.style.height = (60 - layer * 10) + 'px';
                    gear.style.transitionDelay = `${0.2 + layer * 0.1 + i * 0.02}s`;
                    gear.innerHTML = generator.generateSVG(8 + layer * 2, 100);
                    gearBurstLayer.appendChild(gear);
                    gear.dataset.angle = angle; gear.dataset.distance = distance;
                }
            });
            
            const particleLayer = document.getElementById('particle-explosion-layer');
            for (let i = 0; i < 100; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 600 + 200;
                particle.style.transitionDelay = `${0.3 + Math.random() * 0.3}s`;
                particleLayer.appendChild(particle);
                particle.dataset.angle = angle; particle.dataset.distance = distance;
            }
            
            const fractalLayer = document.getElementById('fractal-layer');
            function createFractalBranch(x, y, angle, length, depth) {
                if (depth === 0 || length < 5) return;
                const line = document.createElement('div');
                line.className = 'fractal-line';
                line.style.left = x + 'px'; line.style.top = y + 'px';
                line.style.width = '0px'; line.style.height = '2px';
                line.style.transform = `rotate(${angle}deg)`;
                line.style.transitionDelay = `${0.5 + (5 - depth) * 0.08}s`;
                fractalLayer.appendChild(line);
                line.dataset.finalWidth = length;
                const endX = x + Math.cos(angle * Math.PI / 180) * length;
                const endY = y + Math.sin(angle * Math.PI / 180) * length;
                for (let i = 0; i < 3; i++) {
                    const newAngle = angle + (i - 1) * 30;
                    const newLength = length * 0.7;
                    setTimeout(() => { createFractalBranch(endX, endY, newAngle, newLength, depth - 1); }, 50);
                }
            }
            createFractalBranch(window.innerWidth / 2, window.innerHeight / 2, 0, 150, 5);
            createFractalBranch(window.innerWidth / 2, window.innerHeight / 2, 90, 150, 5);
            createFractalBranch(window.innerWidth / 2, window.innerHeight / 2, 180, 150, 5);
            createFractalBranch(window.innerWidth / 2, window.innerHeight / 2, 270, 150, 5);
        }

        function openGallery(e) {
            e.preventDefault();

            const contentWrapper = document.querySelector('.content-wrapper');
            const footerInfo = document.querySelector('.footer-info');
            const gallery = document.querySelector('.m3-gallery-container');
            const exitOverlay = document.querySelector('.exit-overlay');
            const scanline = document.getElementById('scanline');

            contentWrapper.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            contentWrapper.style.opacity = '0';
            contentWrapper.style.transform = 'translateY(-30px) scale(0.95)';
            contentWrapper.style.pointerEvents = 'none';
            if (footerInfo) footerInfo.style.opacity = '0';

            exitOverlay.classList.add('active');
            
            let scanY = 0;
            const scanInterval = setInterval(() => {
                scanY += 8;
                scanline.style.top = scanY + 'px';
                if (scanY > window.innerHeight) clearInterval(scanInterval);
            }, 10);
            
            setTimeout(() => {
                document.querySelectorAll('.burst-gear').forEach(gear => {
                    const angle = parseFloat(gear.dataset.angle);
                    const distance = parseFloat(gear.dataset.distance);
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;
                    gear.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(3) rotate(360deg)`;
                });
            }, 100);

            setTimeout(() => {
                document.querySelectorAll('.explosion-particle').forEach(p => {
                    const angle = parseFloat(p.dataset.angle);
                    const distance = parseFloat(p.dataset.distance);
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;
                    p.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                    p.style.opacity = '0';
                });
            }, 200);

            setTimeout(() => {
                document.querySelectorAll('.fractal-line').forEach(line => {
                    line.style.width = line.dataset.finalWidth + 'px';
                });
            }, 300);

            setTimeout(() => {
                exitOverlay.style.transition = 'opacity 0.6s ease';
                exitOverlay.style.opacity = '0';
                
                gallery.classList.add('active');
                
                document.body.style.overflow = 'auto';
                document.querySelector('.cursor-main').style.position = 'fixed';
                document.querySelector('.cursor-center').style.position = 'fixed';
            }, 800);
        }

        // ===== 悬停效果 =====
        function addHoverEffects() {
            const hoverElements = document.querySelectorAll('a, button, .logo-frame, .m3-image-card');
            hoverElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursorMain.classList.add('hover');
                    cursorCenter.classList.add('hover');
                });
                el.addEventListener('mouseleave', () => {
                    cursorMain.classList.remove('hover');
                    cursorCenter.classList.remove('hover');
                });
            });
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            createGears();
            createExitTransition();

            document.addEventListener('mousemove', (e) => {
                updateCursor(e);
                updateGlow();
            });
            animateCursor();

            const canvas = document.getElementById('particles-canvas');
            const particleSystem = new ParticleSystem(canvas);
            particleSystem.animate();

            window.addEventListener('resize', () => {
                particleSystem.resize();
            });

            // 绑定新的打开画廊事件
            document.getElementById('enter-btn').addEventListener('click', openGallery);

            simulateLoading();
            setTimeout(addHoverEffects, 2000);
            initM3Ripples();

            document.querySelectorAll('.logo-section, .title-section, .description, .enter-section').forEach(el => {
                el.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
            });

            document.querySelectorAll('.letter').forEach(el => {
                el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            });
        });
    </script>
</body>
